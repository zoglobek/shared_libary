# Jenkins Builder Node Playbook
- name: Configure Jenkins builder node
  hosts: jenkins_nodes
  become: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - git
          - openjdk-11-jdk
          - maven
          - docker.io
          - curl
          - awscli
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Jenkins user
      user:
        name: jenkins
        shell: /bin/bash
        create_home: yes

    - name: Add Jenkins user to Docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Allow Jenkins passwordless sudo (safe method)
      copy:
        dest: /etc/sudoers.d/jenkins
        content: "jenkins ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
        owner: root
        group: root

    - name: Add Jenkins repository key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io.key
        state: present

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb https://pkg.jenkins.io/debian-stable binary/"
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Start and enable Jenkins service
      systemd:
        name: jenkins
        state: started
        enabled: yes
