---
- name: Jenkins Node Health Check
  hosts: jenkins_nodes
  become: yes

  tasks:

    #####################################################################
    # CPU / LOAD
    #####################################################################
    - name: Check system load
      command: uptime
      register: load_output

    - name: Show system load
      debug:
        var: load_output.stdout


    #####################################################################
    # MEMORY
    #####################################################################
    - name: Check memory usage
      command: free -h
      register: mem_output

    - name: Show memory usage
      debug:
        var: mem_output.stdout


    #####################################################################
    # DISK
    #####################################################################
    - name: Check disk usage on root filesystem
      command: df -h /
      register: disk_output

    - name: Show disk usage
      debug:
        var: disk_output.stdout


    #####################################################################
    # DOCKER HEALTH
    #####################################################################
    - name: Check Docker service status
      command: systemctl is-active docker
      register: docker_status
      ignore_errors: yes

    - name: Show Docker service status
      debug:
        var: docker_status.stdout


    #####################################################################
    # JENKINS SERVICE HEALTH
    #####################################################################
    - name: Check Jenkins service status
      command: systemctl is-active jenkins
      register: jenkins_status
      ignore_errors: yes

    - name: Show Jenkins service status
      debug:
        var: jenkins_status.stdout


    #####################################################################
    # NETWORK CONNECTIVITY TO JENKINS MASTER
    #####################################################################
    - name: Check connectivity to Jenkins master
      command: ping -c 2 <JENKINS_MASTER_IP>
      register: ping_output
      ignore_errors: yes

    - name: Show ping result
      debug:
        var: ping_output.stdout


    #####################################################################
    # OPTIONAL: CHECK DOCKER CONTAINERS RUNNING
    #####################################################################
    - name: List running Docker containers
      command: docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
      register: docker_ps
      ignore_errors: yes

    - name: Show running Docker containers
      debug:
        var: docker_ps.stdout


    #####################################################################
    # OPTIONAL: CHECK SYSTEM UPTIME
    #####################################################################
    - name: Check uptime
      command: cat /proc/uptime
      register: uptime_output

    - name: Show uptime
      debug:
        var: uptime_output.stdout
